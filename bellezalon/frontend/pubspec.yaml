name: bellezalon_frontend
description: Frontend for Salon Belleza Pro
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  cached_network_image: ^3.4.1
  provider: ^6.1.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.5.5
  table_calendar: ^3.0.9
  intl: ^0.20.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  image_picker: ^1.0.7
  http_parser: ^4.0.0
  path_provider: ^2.1.2
  flutter_map_cache: ^1.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  geolocator: ^11.0.0
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.2
  permission_handler: ^11.3.1
  path: ^1.9.0
  connectivity_plus: ^6.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/maps/colombia_cities.json
