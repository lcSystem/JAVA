server:
  port: 8082

spring:
  application:
    name: creditos-web
  datasource:
    url: jdbc:mysql://localhost:3306/db_creditos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  flyway:
    repair-on-migrate: true
    validate-on-migrate: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/api/auth/jwks
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
jwt:
  secret: Y2xpZW50LWF1dGgtc2VydmljZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1zZWN1cmUtMjAyNi1zbWFydC1jcmVkaXQtYXBw
  issuer: client-auth

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
