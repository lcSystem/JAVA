server:
  port: 8087

spring:
  application:
    name: client-auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: client_auth_flyway_schema_history

# JWT Configuration
jwt:
  # Base64-encoded secret key (min 256 bits for HS256)
  # IMPORTANT: Change this in production!
  secret: Y2xpZW50LWF1dGgtc2VydmljZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1zZWN1cmUtMjAyNi1zbWFydC1jcmVkaXQtYXBw
  expiration-ms: 3600000       # 1 hour
  refresh-expiration-ms: 86400000  # 24 hours
  issuer: client-auth

# Logging
logging:
  level:
    com.clientauth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
